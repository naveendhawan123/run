<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2-Player Co-Op Runner & Gunner</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="game-container">
    <!-- Lobby Screen -->
    <div id="lobby-view">
      <h2>Co-Op Runner & Gunner</h2>
      <button id="btn-create" class="action-btn">Create Game</button>
      <div class="separator">OR</div>
      <div class="join-box">
        <input type="text" id="input-code" placeholder="GAME CODE" maxlength="6">
        <button id="btn-join" class="action-btn">Join</button>
      </div>
      <p id="lobby-error" class="error"></p>
    </div>

    <!-- Active Game Screen -->
    <div id="game-view" style="display: none;">
      <div class="header">
        <span>Room: <strong id="lbl-code"></strong></span>
        <button id="btn-copy">Copy Invite Link</button>
        <span id="copy-msg"></span>
      </div>

      <div class="status-bar">
        <span id="lbl-role"></span>
        <span id="lbl-status">Waiting for Player 2...</span>
      </div>

      <!-- Single Shared Canvas Track -->
      <canvas id="game-canvas" width="600" height="240"></canvas>

      <!-- Action Buttons -->
      <div class="controls-bar">
        <button id="ctrl-jump" class="ctrl-btn">JUMP [W / ↑ / Space]</button>
        <button id="ctrl-shoot" class="ctrl-btn shoot-btn">SHOOT [F / X / Enter]</button>
      </div>

      <!-- Game Over Banner -->
      <div id="game-over-box" style="display: none;">
        <h3 id="lbl-winner">Both Players Eliminated!</h3>
        <p id="lbl-scores"></p>
        <button id="btn-rematch" class="action-btn">Play Again</button>
        <button id="btn-leave" class="action-btn">Leave Room</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
